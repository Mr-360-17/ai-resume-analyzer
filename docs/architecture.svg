<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
    <style>
      .box { fill: #f2f6fb; stroke: #1f3a5f; stroke-width: 1.5; rx: 10; }
      .ui { fill: #e3f0e6; stroke: #2e6b3f; }
      .title { font-size: 15px; font-weight: 600; fill: #12263f; }
      .sub { font-size: 11.5px; fill: #3b4b5e; }
      .file { font-size: 11px; fill: #1f5fa8; font-family: Consolas, monospace; }
      .flow { stroke: #1f3a5f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .step { font-size: 11px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#12263f">AI Resume Analyzer - workflow</text>

  <!-- Row 1: left to right -->
  <g>
    <rect class="box ui" x="20" y="50" width="210" height="100" rx="10"/>
    <circle cx="40" cy="70" r="11" fill="#2e6b3f"/><text class="step" x="40" y="74" text-anchor="middle">1</text>
    <text class="title" x="58" y="75">Resume upload</text>
    <text class="sub" x="34" y="100">PDF / DOCX, type and size check</text>
    <text class="sub" x="34" y="117">read in memory, never stored</text>
    <text class="file" x="34" y="138">app.py</text>
  </g>
  <g>
    <rect class="box" x="255" y="50" width="210" height="100" rx="10"/>
    <circle cx="275" cy="70" r="11" fill="#1f3a5f"/><text class="step" x="275" y="74" text-anchor="middle">2</text>
    <text class="title" x="293" y="75">Text extraction</text>
    <text class="sub" x="269" y="100">pypdf: every page</text>
    <text class="sub" x="269" y="117">python-docx: paragraphs + tables</text>
    <text class="file" x="269" y="138">resume_parser.py</text>
  </g>
  <g>
    <rect class="box" x="490" y="50" width="210" height="100" rx="10"/>
    <circle cx="510" cy="70" r="11" fill="#1f3a5f"/><text class="step" x="510" y="74" text-anchor="middle">3</text>
    <text class="title" x="528" y="75">Cleaning + privacy</text>
    <text class="sub" x="504" y="100">lowercase, keep C++ / C# / .NET</text>
    <text class="sub" x="504" y="117">drop personal lines, find sections</text>
    <text class="file" x="504" y="138">text_cleaner.py</text>
  </g>
  <g>
    <rect class="box" x="725" y="50" width="215" height="100" rx="10"/>
    <circle cx="745" cy="70" r="11" fill="#1f3a5f"/><text class="step" x="745" y="74" text-anchor="middle">4</text>
    <text class="title" x="763" y="75">Skill extraction</text>
    <text class="sub" x="739" y="100">regex match on skill aliases</text>
    <text class="sub" x="739" y="117">category + project evidence</text>
    <text class="file" x="739" y="138">data/skill_dictionary.csv</text>
  </g>

  <path class="flow" d="M230,100 L253,100"/>
  <path class="flow" d="M465,100 L488,100"/>
  <path class="flow" d="M700,100 L723,100"/>
  <path class="flow" d="M832,150 L832,208"/>

  <!-- Row 2: right to left -->
  <g>
    <rect class="box" x="725" y="210" width="215" height="110" rx="10"/>
    <circle cx="745" cy="230" r="11" fill="#1f3a5f"/><text class="step" x="745" y="234" text-anchor="middle">5</text>
    <text class="title" x="763" y="235">Role matching</text>
    <text class="sub" x="739" y="258">70% skill coverage</text>
    <text class="sub" x="739" y="274">+ 30% TF-IDF cosine similarity</text>
    <text class="sub" x="739" y="290">rank roles high to low</text>
    <text class="file" x="739" y="310">job_matcher.py, job_roles.csv</text>
  </g>
  <g>
    <rect class="box" x="490" y="210" width="210" height="110" rx="10"/>
    <circle cx="510" cy="230" r="11" fill="#1f3a5f"/><text class="step" x="510" y="234" text-anchor="middle">6</text>
    <text class="title" x="528" y="235">Skill-gap analysis</text>
    <text class="sub" x="504" y="258">found vs missing skills</text>
    <text class="sub" x="504" y="274">weak = listed but not used</text>
    <text class="sub" x="504" y="290">in projects / experience</text>
    <text class="file" x="504" y="310">pipeline.py</text>
  </g>
  <g>
    <rect class="box" x="255" y="210" width="210" height="110" rx="10"/>
    <circle cx="275" cy="230" r="11" fill="#1f3a5f"/><text class="step" x="275" y="234" text-anchor="middle">7</text>
    <text class="title" x="293" y="235">Learning roadmap</text>
    <text class="sub" x="269" y="258">missing required skills first</text>
    <text class="sub" x="269" y="274">1-2 skills per week</text>
    <text class="sub" x="269" y="290">ends with a portfolio project</text>
    <text class="file" x="269" y="310">roadmap_generator.py</text>
  </g>
  <g>
    <rect class="box ui" x="20" y="210" width="210" height="110" rx="10"/>
    <circle cx="40" cy="230" r="11" fill="#2e6b3f"/><text class="step" x="40" y="234" text-anchor="middle">8</text>
    <text class="title" x="58" y="235">Dashboard + report</text>
    <text class="sub" x="34" y="258">top-3 roles, score chart</text>
    <text class="sub" x="34" y="274">skills, gaps, roadmap</text>
    <text class="sub" x="34" y="290">PDF / CSV download</text>
    <text class="file" x="34" y="310">app.py, report_generator.py</text>
  </g>

  <path class="flow" d="M725,265 L702,265"/>
  <path class="flow" d="M490,265 L467,265"/>
  <path class="flow" d="M255,265 L232,265"/>

  <!-- Responsible AI band -->
  <rect x="20" y="345" width="920" height="54" rx="10" fill="#fff6e5" stroke="#c98a12" stroke-width="1.2"/>
  <text x="36" y="367" font-size="13" font-weight="600" fill="#7a5200">Responsible AI</text>
  <text x="36" y="387" font-size="11.5" fill="#5c4300">Gender, age, religion, nationality, marital status, disability and contact lines are removed before scoring.  Scores are estimates for guidance, not hiring decisions.</text>
</svg>
